server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets (images, fonts, JS, CSS) from the root regardless of URL prefix
    location ~* \.(jpg|jpeg|png|gif|ico|svg|js|css|woff|woff2|ttf|eot|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Language routes: /it/, /en/, /es/, /de/
    location ~ ^/(it|en|es|de)/$ {
        try_files /$1/index.html =404;
    }

    # Root: serve the browser-detect redirect
    location = / {
        try_files /index.html =404;
    }

    # Fallback for any other path
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
